name: Apply HD flow-map parity

on:
  push:
    branches:
      - "impl/117hd-material-terrain-parity"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: "impl/117hd-material-terrain-parity"
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Apply flow-map patch
        run: python3 scripts/apply_hd_flow_map_parity.py
      - name: Format
        run: cargo fmt --all
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --locked --workspace --all-targets --all-features
      - name: Run HD material binding gate
        run: cargo test --locked -p osrs-render --test hd_material_binding
      - name: Commit result
        run: |
          rm scripts/apply_hd_flow_map_parity.py
          rm .github/workflows/apply-hd-flow-map-parity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(hd): apply RLHD flow-map UV distortion"
          git push origin HEAD:impl/117hd-material-terrain-parity
