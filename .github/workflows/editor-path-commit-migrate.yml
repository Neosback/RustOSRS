name: Editor path commit migration helper

on:
  push:
    branches:
      - refactor/editor-path-commit-domain

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply scoped migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cargo = Path('crates/osrs-editor/Cargo.toml')
          text = cargo.read_text()
          needle = 'osrs-core = { path = "../osrs-core" }\n'
          if 'osrs-edit = { path = "../osrs-edit" }' not in text:
              text = text.replace(needle, needle + 'osrs-edit = { path = "../osrs-edit" }\n', 1)
          cargo.write_text(text)

          lock = Path('Cargo.lock')
          text = lock.read_text()
          package_start = text.index('[[package]]\nname = "osrs-editor"')
          package_end = text.index('\n[[package]]', package_start + 1)
          package = text[package_start:package_end]
          if ' "osrs-edit",' not in package:
              package = package.replace(' "osrs-core",\n', ' "osrs-core",\n "osrs-edit",\n', 1)
              text = text[:package_start] + package + text[package_end:]
          lock.write_text(text)

          app = Path('crates/osrs-editor/src/app.rs')
          text = app.read_text()
          if 'mod path_commit;' not in text:
              text = text.replace('mod object_tool;\n', 'mod object_tool;\nmod path_commit;\n', 1)
          app.write_text(text)

          spline = Path('crates/osrs-editor/src/app/spline_tool.rs')
          text = spline.read_text()
          old = 'let changed = self.apply_path(&tiles, Vec::new());'
          new = 'let changed = self.apply_terrain_path(&tiles);'
          if old not in text:
              raise SystemExit('normal terrain path commit call not found')
          text = text.replace(old, new, 1)
          spline.write_text(text)

          editing = Path('crates/osrs-editor/src/app/editing.rs')
          text = editing.read_text()
          text = text.replace(
              'use super::EditorApp;\n',
              'use super::EditorApp;\nuse super::path_commit::{TerrainPathIntent, build_terrain_path_patch};\n',
              1,
          )
          text = text.replace(
              'use osrs_core::coords::RegionCoord;\n',
              'use osrs_core::coords::{MapTile, RegionCoord, SourcePlane};\nuse osrs_core::ids::{FloorOverlayId, FloorUnderlayId};\nuse osrs_edit::{\n    HeightVertexCoord, MapDocument, MapPosition, OverlayRotation, OverlayShape, TerrainOverlay,\n    TerrainTile,\n};\n',
              1,
          )
          text = text.replace(
              'use std::collections::HashMap;\n',
              'use std::collections::{HashMap, HashSet};\n',
              1,
          )

          marker = '''pub struct PathTile {
    pub tile: (i32, i32),
    pub overlay: Option<u16>,
    pub shape: u8,
    pub rotation: u8,
}
'''
          helpers = marker + '''
fn semantic_terrain(values: TileValues) -> Option<TerrainTile> {
    let underlay = (values.underlay != 0)
        .then(|| FloorUnderlayId::new(u32::from(values.underlay)));
    let overlay = if values.overlay == 0 {
        None
    } else {
        Some(TerrainOverlay {
            id: FloorOverlayId::new(u32::from(values.overlay)),
            shape: OverlayShape::new(values.shape)?,
            rotation: OverlayRotation::new(values.rotation)?,
        })
    };
    Some(TerrainTile {
        underlay,
        overlay,
        flags: values.flags,
    })
}

fn project_semantic_terrain(values: &mut TileValues, terrain: TerrainTile) -> Option<()> {
    values.underlay = match terrain.underlay {
        Some(id) => u16::try_from(id.get()).ok()?,
        None => 0,
    };
    match terrain.overlay {
        Some(overlay) => {
            values.overlay = u16::try_from(overlay.id.get()).ok()?;
            values.shape = overlay.shape.get();
            values.rotation = overlay.rotation.get();
        }
        None => {
            values.overlay = 0;
            values.shape = 0;
            values.rotation = 0;
        }
    }
    values.flags = terrain.flags;
    Some(())
}
'''
          if 'fn semantic_terrain(' not in text:
              if marker not in text:
                  raise SystemExit('PathTile marker not found')
              text = text.replace(marker, helpers, 1)

          apply_marker = '''    /// Lay a path: each tile's overlay with its shape and rotation, the other armed channels of the
    /// brush, and spawned `added` objects (one undo step). Returns how many tiles changed.
    pub(super) fn apply_path(&mut self, tiles: &[PathTile], added: Vec<LocSpec>) -> usize {
'''
          domain_method = '''    /// Lay a normal terrain path through the semantic edit-domain boundary.
    ///
    /// The domain patch is the canonical description of this commit. The patched semantic snapshot
    /// is then projected into the existing world edit layer and legacy undo stack so rendering and
    /// editor-wide undo behavior remain unchanged while migration proceeds one tool at a time.
    pub(super) fn apply_terrain_path(&mut self, tiles: &[PathTile]) -> usize {
        if tiles.is_empty() {
            return 0;
        }
        let Some(plane) = SourcePlane::new(self.view_plane) else {
            self.notice = Some(("The path uses an invalid source plane".to_owned(), Instant::now()));
            return 0;
        };

        let brush = self.prefs.brush.clone();
        let mut terrain = Vec::new();
        let mut heights = Vec::new();
        let mut intents = Vec::new();
        let mut snapshotted = HashSet::new();

        for path_tile in tiles {
            let key = (self.view_plane, path_tile.tile.0, path_tile.tile.1);
            let Some(before) = self.current_tile(key) else {
                continue;
            };
            let Some(before_terrain) = semantic_terrain(before) else {
                self.notice = Some((
                    format!("The path was not laid: tile {:?} has invalid terrain shape data", path_tile.tile),
                    Instant::now(),
                ));
                return 0;
            };
            let map_tile = MapTile::new(path_tile.tile.0, path_tile.tile.1);
            if snapshotted.insert(path_tile.tile) {
                terrain.push((MapPosition::new(map_tile, plane), before_terrain));
                heights.push((HeightVertexCoord::new(map_tile, plane), before.height));
            }
            let height = brush
                .height
                .armed
                .then(|| self.quantize_height(key, brush.height.value));
            let flags = brush.flags.armed.then_some(brush.flags.bits);
            intents.push(TerrainPathIntent::from_path_tile(*path_tile, height, flags));
        }

        if intents.is_empty() {
            return 0;
        }

        let mut document = MapDocument::from_parts(terrain, heights, []);
        let patch = match build_terrain_path_patch(&document, plane, &intents) {
            Ok(patch) => patch,
            Err(error) => {
                self.notice = Some((
                    format!("The path was not laid: invalid semantic commit data ({error:?})"),
                    Instant::now(),
                ));
                return 0;
            }
        };
        if patch.is_empty() {
            return 0;
        }
        if let Err(error) = document.apply_patch(&patch) {
            self.notice = Some((
                format!("The path was not laid: semantic patch validation failed ({error:?})"),
                Instant::now(),
            ));
            return 0;
        }

        let mut projected = HashSet::new();
        let mut final_tiles = Vec::new();
        for intent in &intents {
            if !projected.insert(intent.tile) {
                continue;
            }
            let key = (self.view_plane, intent.tile.0, intent.tile.1);
            let Some(mut after) = self.current_tile(key) else {
                continue;
            };
            let map_tile = MapTile::new(intent.tile.0, intent.tile.1);
            let position = MapPosition::new(map_tile, plane);
            if project_semantic_terrain(&mut after, document.terrain_at(position)).is_none() {
                self.notice = Some((
                    "The path was not laid: semantic terrain IDs exceed the legacy adapter range"
                        .to_owned(),
                    Instant::now(),
                ));
                return 0;
            }
            let vertex = HeightVertexCoord::new(map_tile, plane);
            if let Some(height) = document.height_at(vertex) {
                after.height = height;
            }
            final_tiles.push((key, after));
        }

        self.begin_stroke();
        let Some(mut stroke) = self.stroke.take() else {
            return 0;
        };
        let mut edits = Vec::new();
        for (key, after) in final_tiles {
            self.record(&mut stroke, key, after, &mut edits);
        }
        let count = edits.len();
        self.send_edits(edits);
        self.stroke = Some(stroke);
        self.end_stroke();
        count
    }

''' + apply_marker
          if 'pub(super) fn apply_terrain_path' not in text:
              if apply_marker not in text:
                  raise SystemExit('apply_path marker not found')
              text = text.replace(apply_marker, domain_method, 1)
          editing.write_text(text)

          path_commit = Path('crates/osrs-editor/src/app/path_commit.rs')
          path_commit.write_text(r'''//! Semantic commit adapter for the existing terrain-path tool.
//!
//! Planning and preview remain in `terrain_path` / `spline_tool`. This module only turns the
//! already-planned tile intent into one reversible `MapPatch` against read-only semantic state.

use super::editing::PathTile;
use osrs_core::coords::{MapTile, SourcePlane};
use osrs_core::ids::FloorOverlayId;
use osrs_edit::{
    HeightVertexCoord, MapOp, MapPatch, MapPosition, MapQuery, OverlayRotation, OverlayShape,
    TerrainOverlay, TerrainTile,
};
use std::collections::HashMap;

#[derive(Debug, Clone, Copy, PartialEq, Eq)]
pub(super) struct TerrainPathIntent {
    pub tile: (i32, i32),
    pub overlay: Option<u16>,
    pub shape: u8,
    pub rotation: u8,
    pub height: Option<i32>,
    pub flags: Option<u8>,
}

impl TerrainPathIntent {
    pub const fn from_path_tile(tile: PathTile, height: Option<i32>, flags: Option<u8>) -> Self {
        Self {
            tile: tile.tile,
            overlay: tile.overlay,
            shape: tile.shape,
            rotation: tile.rotation,
            height,
            flags,
        }
    }
}

#[derive(Debug, Clone, Copy, PartialEq, Eq)]
pub(super) enum PathCommitError {
    InvalidOverlayShape { tile: (i32, i32), shape: u8 },
    InvalidOverlayRotation { tile: (i32, i32), rotation: u8 },
    MissingHeight { tile: (i32, i32) },
}

/// Build one compact semantic patch for a completed terrain-path gesture.
///
/// Duplicate tile intents are folded into one final terrain operation and one final height
/// operation per coordinate. This keeps one laid path deterministic and prevents transient
/// duplicate planner output from becoming redundant history operations.
pub(super) fn build_terrain_path_patch(
    query: &impl MapQuery,
    plane: SourcePlane,
    intents: &[TerrainPathIntent],
) -> Result<MapPatch, PathCommitError> {
    let mut terrain_order = Vec::new();
    let mut terrain = HashMap::<MapPosition, (TerrainTile, TerrainTile)>::new();
    let mut height_order = Vec::new();
    let mut heights = HashMap::<HeightVertexCoord, (i32, i32)>::new();

    for intent in intents {
        let map_tile = MapTile::new(intent.tile.0, intent.tile.1);
        let position = MapPosition::new(map_tile, plane);
        let current = terrain
            .get(&position)
            .map_or_else(|| query.terrain_at(position), |(_, after)| *after);
        let entry = terrain.entry(position).or_insert_with(|| {
            terrain_order.push(position);
            (current, current)
        });
        let mut after = entry.1;

        if let Some(id) = intent.overlay {
            if id == 0 {
                after.overlay = None;
            } else {
                let Some(shape) = OverlayShape::new(intent.shape) else {
                    return Err(PathCommitError::InvalidOverlayShape {
                        tile: intent.tile,
                        shape: intent.shape,
                    });
                };
                let Some(rotation) = OverlayRotation::new(intent.rotation) else {
                    return Err(PathCommitError::InvalidOverlayRotation {
                        tile: intent.tile,
                        rotation: intent.rotation,
                    });
                };
                after.overlay = Some(TerrainOverlay {
                    id: FloorOverlayId::new(u32::from(id)),
                    shape,
                    rotation,
                });
            }
        }
        if let Some(flags) = intent.flags {
            after.flags = flags;
        }
        entry.1 = after;

        if let Some(target_height) = intent.height {
            let vertex = HeightVertexCoord::new(map_tile, plane);
            let current_height = heights
                .get(&vertex)
                .map(|(_, after)| *after)
                .or_else(|| query.height_at(vertex));
            let Some(current_height) = current_height else {
                return Err(PathCommitError::MissingHeight { tile: intent.tile });
            };
            let entry = heights.entry(vertex).or_insert_with(|| {
                height_order.push(vertex);
                (current_height, current_height)
            });
            entry.1 = target_height;
        }
    }

    let mut ops = Vec::with_capacity(terrain_order.len() + height_order.len());
    for coord in terrain_order {
        if let Some((before, after)) = terrain.get(&coord).copied()
            && before != after
        {
            ops.push(MapOp::SetTerrain {
                coord,
                before,
                after,
            });
        }
    }
    for coord in height_order {
        if let Some((before, after)) = heights.get(&coord).copied()
            && before != after
        {
            ops.push(MapOp::SetHeight {
                coord,
                before,
                after,
            });
        }
    }

    Ok(MapPatch::new(ops))
}

#[cfg(test)]
mod tests {
    use super::*;
    use osrs_core::ids::FloorUnderlayId;
    use osrs_edit::{MapDocument, TerrainTile};

    fn plane() -> SourcePlane {
        SourcePlane::new(0).unwrap_or_else(|| unreachable!("plane zero is valid"))
    }

    fn position(tile: (i32, i32)) -> MapPosition {
        MapPosition::new(MapTile::new(tile.0, tile.1), plane())
    }

    fn vertex(tile: (i32, i32)) -> HeightVertexCoord {
        HeightVertexCoord::new(MapTile::new(tile.0, tile.1), plane())
    }

    fn intent(
        tile: (i32, i32),
        overlay: u16,
        shape: u8,
        rotation: u8,
    ) -> TerrainPathIntent {
        TerrainPathIntent {
            tile,
            overlay: Some(overlay),
            shape,
            rotation,
            height: None,
            flags: None,
        }
    }

    #[test]
    fn path_patch_preserves_unpainted_channels_and_updates_armed_channels() {
        let tile = (3200, 3200);
        let before = TerrainTile {
            underlay: Some(FloorUnderlayId::new(3)),
            overlay: None,
            flags: 1,
        };
        let mut document = MapDocument::from_parts(
            [(position(tile), before)],
            [(vertex(tile), 32)],
            [],
        );
        let mut path = intent(tile, 7, 4, 2);
        path.height = Some(64);
        path.flags = Some(5);

        let patch = build_terrain_path_patch(&document, plane(), &[path])
            .unwrap_or_else(|error| unreachable!("valid path patch: {error:?}"));
        assert_eq!(patch.len(), 2);
        assert!(document.apply_patch(&patch).is_ok());

        let after = document.terrain_at(position(tile));
        assert_eq!(after.underlay, before.underlay);
        assert_eq!(after.flags, 5);
        let overlay = after
            .overlay
            .unwrap_or_else(|| unreachable!("path should set an overlay"));
        assert_eq!(overlay.id.get(), 7);
        assert_eq!(overlay.shape.get(), 4);
        assert_eq!(overlay.rotation.get(), 2);
        assert_eq!(document.height_at(vertex(tile)), Some(64));
    }

    #[test]
    fn duplicate_tile_intents_collapse_to_one_final_terrain_op() {
        let tile = (3200, 3200);
        let mut document = MapDocument::from_parts([], [(vertex(tile), 0)], []);
        let path = [intent(tile, 7, 1, 0), intent(tile, 8, 2, 3)];

        let patch = build_terrain_path_patch(&document, plane(), &path)
            .unwrap_or_else(|error| unreachable!("valid path patch: {error:?}"));
        assert_eq!(patch.len(), 1);
        assert!(document.apply_patch(&patch).is_ok());
        let overlay = document
            .terrain_at(position(tile))
            .overlay
            .unwrap_or_else(|| unreachable!("path should set an overlay"));
        assert_eq!(overlay.id.get(), 8);
        assert_eq!(overlay.shape.get(), 2);
        assert_eq!(overlay.rotation.get(), 3);
    }

    #[test]
    fn semantic_no_op_produces_an_empty_patch() {
        let tile = (3200, 3200);
        let overlay = TerrainOverlay {
            id: FloorOverlayId::new(7),
            shape: OverlayShape::new(4)
                .unwrap_or_else(|| unreachable!("overlay shape four is valid")),
            rotation: OverlayRotation::new(2)
                .unwrap_or_else(|| unreachable!("overlay rotation two is valid")),
        };
        let document = MapDocument::from_parts(
            [(position(tile), TerrainTile { underlay: None, overlay: Some(overlay), flags: 0 })],
            [(vertex(tile), 32)],
            [],
        );

        let patch = build_terrain_path_patch(&document, plane(), &[intent(tile, 7, 4, 2)])
            .unwrap_or_else(|error| unreachable!("valid path patch: {error:?}"));
        assert!(patch.is_empty());
    }

    #[test]
    fn armed_height_requires_an_explicit_height_vertex() {
        let tile = (3200, 3200);
        let document = MapDocument::new();
        let mut path = intent(tile, 7, 0, 0);
        path.height = Some(64);

        assert_eq!(
            build_terrain_path_patch(&document, plane(), &[path]),
            Err(PathCommitError::MissingHeight { tile })
        );
    }
}
''')

          workflow = Path('.github/workflows/editor-path-commit-migrate.yml')
