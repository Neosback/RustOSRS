name: Editor path commit migration helper

on:
  push:
    branches:
      - refactor/editor-path-commit-domain

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply scoped migration
        run: python3 .github/scripts/path_commit_migrate.py
      - name: Format and commit
        run: |
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(editor): route terrain path commits through edit domain"
          git push origin HEAD:${GITHUB_REF_NAME}
