name: Apply terrain path migration fixes

on:
  push:
    branches:
      - fix/spline-path-reliability

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/spline-path-reliability
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - run: python3 scripts/apply_terrain_path_migration_fix.py
      - run: cargo fmt --all
      - run: rm scripts/apply_terrain_path_migration_fix.py .github/workflows/branch-fix.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(editor): complete terrain path migration compile wiring"
          git push origin HEAD:fix/spline-path-reliability
