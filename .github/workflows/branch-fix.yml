name: Apply terrain path migration fixes

on:
  push:
    branches:
      - fix/spline-path-reliability

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/spline-path-reliability
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Apply migration fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/osrs-editor/src/app/workspace.rs')
          text = path.read_text()
          old = '''            Tool::Spline => {
                crate::theme::section_heading(ui, "Path");
                ui.horizontal(|ui| {
                    ui.weak("Width");
                    ui.add(
                        egui::DragValue::new(&mut self.prefs.spline.width)
                            .range(1.0..=32.0)
                            .speed(0.1)
                            .suffix(" tiles"),
                    );
                    for style in crate::autotile::EdgeStyle::ALL {
                        ui.selectable_value(&mut self.prefs.spline.style, style, style.label());
                    }
                });
            }
'''
          new = '''            Tool::Spline => {
                crate::theme::section_heading(ui, "Path");
                ui.horizontal(|ui| {
                    ui.weak("Width");
                    ui.add(
                        egui::DragValue::new(&mut self.prefs.spline.profile.base_width)
                            .range(0.5..=24.0)
                            .speed(0.1)
                            .suffix(" tiles"),
                    );
                    for mode in crate::paint::PathMode::ALL {
                        ui.selectable_value(&mut self.prefs.spline.mode, mode, mode.label());
                    }
                });
            }
'''
          assert old in text, 'workspace spline quick options changed unexpectedly'
          path.write_text(text.replace(old, new))

          path = Path('crates/osrs-editor/src/app/editing.rs')
          text = path.read_text()
          assert 'use crate::paint::{Brush, Fill, TileValues, Tool};' in text
          path.write_text(text.replace(
              'use crate::paint::{Brush, Fill, TileValues, Tool};',
              'use crate::paint::{Brush, TileValues, Tool};'))

          path = Path('crates/osrs-editor/src/terrain_path/mod.rs')
          text = path.read_text()
          old = '''pub use model::{
    CostGrid, Occupancy, PathEdge, PathEnvironment, PathNetwork, PathNode, PathPlan, PathPoint,
    PathWarning, Severity, TileBounds, TilePaint,
};
'''
          new = '''pub use model::{PathEnvironment, PathPoint, PathWarning, Severity, TilePaint};
'''
          assert old in text, 'terrain_path model reexports changed unexpectedly'
          text = text.replace(old, new)
          text = text.replace(
              'pub use settings::{AutoConnectPolicy, MaterialVariant, ObstaclePolicy, PathProfile, PathSettings};',
              'pub use settings::{AutoConnectPolicy, ObstaclePolicy, PathProfile, PathSettings};')
          path.write_text(text)

          path = Path('crates/osrs-editor/src/app/spline_tool.rs')
          text = path.read_text()
          assert 'let mut tile_polygon = |tile: (i32, i32), shape: u8, rotation: u8|' in text
          path.write_text(text.replace(
              'let mut tile_polygon = |tile: (i32, i32), shape: u8, rotation: u8|',
              'let tile_polygon = |tile: (i32, i32), shape: u8, rotation: u8|'))
          PY
          cargo fmt --all
          rm .github/workflows/branch-fix.yml
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(editor): complete terrain path migration compile wiring"
          git push origin HEAD:fix/spline-path-reliability
