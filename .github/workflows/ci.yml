name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-transport-fix:
    name: M3 transport warning fix
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/impl/m3-cache-definition-decoding' &&
      !contains(github.event.head_commit.message, 'fix: remove dead transport internals')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Refine private transport errors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('crates/osrs-cache/src/transport.rs')
          text = path.read_text()
          text = re.sub(r'TransportError::MissingIndex\([^\n)]*\)', 'TransportError::MissingIndex', text)
          text = re.sub(r'TransportError::MissingGroup\s*\{[^}]*\}', 'TransportError::MissingGroup', text)
          text = re.sub(r'TransportError::MissingMetadata\s*\{[^}]*\}', 'TransportError::MissingMetadata', text)
          text = re.sub(
              r'    MissingIndex\(u8\),\n    MissingGroup \{\n        index: u8,\n        group: u32,\n    \},\n    MissingMetadata \{\n        index: u8,\n        group: u32,\n    \},',
              '    MissingIndex,\n    MissingGroup,\n    MissingMetadata,',
              text,
          )
          text = text.replace('    fn group_count(&self)', '    #[cfg(test)]\n    fn group_count(&self)')
          text = text.replace('    fn group_id_by_name(&self', '    #[cfg(test)]\n    fn group_id_by_name(&self')
          text = text.replace('fn jagex_name_hash(name: &str)', '#[cfg(test)]\nfn jagex_name_hash(name: &str)')
          path.write_text(text)
          PY
          cargo fmt --all

      - name: Verify warning fix compiles
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Commit warning fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/osrs-cache/src/transport.rs
          git commit -m "fix: remove dead transport internals"
          git push origin HEAD:impl/m3-cache-definition-decoding

  tier-a:
    name: Tier A - static quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Check architecture boundaries
        run: python3 scripts/check_architecture.py

      - name: Test architecture guard
        run: python3 scripts/test_check_architecture.py

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check workspace
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  tier-b:
    name: Tier B - fast tests
    runs-on: ubuntu-latest
    needs: tier-a
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Run workspace tests
        run: cargo test --locked --workspace --all-targets --all-features

  tier-c:
    name: Tier C - M3 decode parity
    runs-on: ubuntu-latest
    needs: tier-b
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Run checked-in P0 decode fixtures
        run: cargo test --locked -p osrs-cache --test m3_decode_fixtures

      - name: Run deterministic decoder fuzz smoke
        run: cargo test --locked -p osrs-cache --test m3_fuzz_smoke
