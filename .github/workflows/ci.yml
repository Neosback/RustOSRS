name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  fast-gate:
    name: Fast Quality Gate (Format & Clippy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: clippy, rustfmt
          cache: false

      - name: Install Linux build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -qq -y pkg-config libasound2-dev

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "workspace-fast-ci"

      - name: Check architecture boundaries
        run: python3 scripts/check_architecture.py

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  procgen-semantic-tests:
    name: Targeted Procgen Semantic Tests
    needs: fast-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "workspace-fast-ci"

      - name: Run vertical procgen tests
        run: cargo test --locked -p osrs-edit building_vertical

      - name: Run roof procgen tests
        run: cargo test --locked -p osrs-edit building_roof

      - name: Run end-to-end building procgen tests
        run: cargo test --locked -p osrs-edit building_generation

  tests:
    name: Full Test Suite
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-ci]'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false

      - name: Install Linux build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -qq -y mold pkg-config libasound2-dev

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "workspace-fast-ci"

      - name: Run workspace tests
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
        run: cargo test --locked --workspace --all-targets --all-features
