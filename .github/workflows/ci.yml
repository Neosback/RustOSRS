name: CI

# One Linux job, cheapest checks first, defined by scripts/verify.py (the same gate as local
# `python3 scripts/verify.py --full`). Markdown-only changes and superseded runs cost nothing.
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  RUST_BACKTRACE: short
  # Debug info only costs compile and cache time here; panics still print file:line.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      # rust-toolchain.toml pins the version, components and the wasm32 target.
      # rustflags: "" keeps the action from setting RUSTFLAGS, which would override
      # .cargo/config.toml (the wasm getrandom cfg).
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
          rustflags: ""

      # Seconds, no compilation: Python guards and rustfmt. Fails before the cache is restored.
      - name: Quick gates
        run: python3 scripts/verify.py --full --stage quick

      - name: Linux build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -qq -y --no-install-recommends pkg-config libasound2-dev

      # Only main writes the cache; pull requests restore it.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy (native and wasm) and tests
        run: python3 scripts/verify.py --full --stage build
