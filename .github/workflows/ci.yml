name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-xtea-validation:
    name: M3 XTEA validation closure
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/impl/m3-cache-definition-decoding' &&
      !contains(github.event.head_commit.message, 'fix: validate XTEA containers after decipher')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Align XTEA validation order with dependency decode contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/osrs-cache/src/transport.rs')
          text = path.read_text()

          old = '''        let encoded = self.read_encoded_group_limited(index_id, group_id, max_encoded_bytes)?;
        validate_encoded_container(&encoded, max_encoded_bytes, max_decoded_bytes)?;
        let mut buffer = Buffer::<Encoded>::from(encoded);
        if let Some(keys) = xtea {
            buffer = buffer.with_xtea_keys(keys);
        }
        let decoded = buffer.decode()?.finalize();
'''
          new = '''        let encoded = self.read_encoded_group_limited(index_id, group_id, max_encoded_bytes)?;
        let prepared = prepare_encoded_container_for_decode(
            encoded,
            xtea,
            max_encoded_bytes,
            max_decoded_bytes,
        )?;
        let decoded = Buffer::<Encoded>::from(prepared).decode()?.finalize();
'''
          if text.count(old) != 1:
              raise SystemExit(f'read_decoded_group patch expected one match, found {text.count(old)}')
          text = text.replace(old, new, 1)

          marker = 'fn validate_encoded_container(\n'
          if text.count(marker) != 1:
              raise SystemExit(f'validator marker expected one match, found {text.count(marker)}')

          helper = '''fn prepare_encoded_container_for_decode(
    mut encoded: Vec<u8>,
    xtea: Option<[u32; 4]>,
    max_encoded_bytes: usize,
    max_decoded_bytes: usize,
) -> TransportResult<Vec<u8>> {
    validate_encoded_container_envelope(&encoded, max_encoded_bytes)?;
    if let Some(keys) = xtea {
        runefs::xtea::decipher(&mut encoded[5..], &keys);
    }
    validate_encoded_container(&encoded, max_encoded_bytes, max_decoded_bytes)?;
    Ok(encoded)
}

fn validate_encoded_container_envelope(
    encoded: &[u8],
    max_encoded_bytes: usize,
) -> TransportResult<(u8, usize, usize)> {
    if encoded.len() > max_encoded_bytes {
        return Err(TransportError::LimitExceeded {
            field: "encoded group bytes",
            requested: encoded.len(),
            limit: max_encoded_bytes,
        });
    }
    if encoded.len() < 5 {
        return Err(TransportError::MalformedContainer(
            "container is shorter than compression byte plus length".to_owned(),
        ));
    }
    let compression = encoded[0];
    if compression > 2 {
        return Err(TransportError::MalformedContainer(format!(
            "unsupported OSRS compression id {compression}"
        )));
    }
    let compressed_len =
        u32::from_be_bytes([encoded[1], encoded[2], encoded[3], encoded[4]]) as usize;
    if compressed_len > max_encoded_bytes {
        return Err(TransportError::LimitExceeded {
            field: "compressed payload bytes",
            requested: compressed_len,
            limit: max_encoded_bytes,
        });
    }
    let header_len = if compression == 0 { 5usize } else { 9usize };
    if encoded.len() < header_len {
        return Err(TransportError::MalformedContainer(
            "compressed container is missing decompressed length".to_owned(),
        ));
    }
    let payload_end = header_len.checked_add(compressed_len).ok_or_else(|| {
        TransportError::MalformedContainer("payload end overflowed usize".to_owned())
    })?;
    if payload_end > encoded.len() {
        return Err(TransportError::MalformedContainer(format!(
            "declared compressed payload ends at {payload_end}, container length is {}",
            encoded.len()
        )));
    }
    let trailing = encoded.len() - payload_end;
    if trailing != 0 && trailing != 2 {
        return Err(TransportError::MalformedContainer(format!(
            "container has {trailing} trailing bytes; expected zero or two-byte version"
        )));
    }
    Ok((compression, compressed_len, header_len))
}

'''
          text = text.replace(marker, helper + marker, 1)

          old_validator = '''fn validate_encoded_container(
    encoded: &[u8],
    max_encoded_bytes: usize,
    max_decoded_bytes: usize,
) -> TransportResult<()> {
    if encoded.len() > max_encoded_bytes {
        return Err(TransportError::LimitExceeded {
            field: "encoded group bytes",
            requested: encoded.len(),
            limit: max_encoded_bytes,
        });
    }
    if encoded.len() < 5 {
        return Err(TransportError::MalformedContainer(
            "container is shorter than compression byte plus length".to_owned(),
        ));
    }
    let compression = encoded[0];
    if compression > 2 {
        return Err(TransportError::MalformedContainer(format!(
            "unsupported OSRS compression id {compression}"
        )));
    }
    let compressed_len =
        u32::from_be_bytes([encoded[1], encoded[2], encoded[3], encoded[4]]) as usize;
    if compressed_len > max_encoded_bytes {
        return Err(TransportError::LimitExceeded {
            field: "compressed payload bytes",
            requested: compressed_len,
            limit: max_encoded_bytes,
        });
    }

    let (header_len, decoded_len) = if compression == 0 {
        (5usize, compressed_len)
    } else {
        if encoded.len() < 9 {
            return Err(TransportError::MalformedContainer(
                "compressed container is missing decompressed length".to_owned(),
            ));
        }
        let decoded_len =
            u32::from_be_bytes([encoded[5], encoded[6], encoded[7], encoded[8]]) as usize;
        (9usize, decoded_len)
    };
    if decoded_len > max_decoded_bytes {
        return Err(TransportError::LimitExceeded {
            field: "declared decoded group bytes",
            requested: decoded_len,
            limit: max_decoded_bytes,
        });
    }
    let payload_end = header_len.checked_add(compressed_len).ok_or_else(|| {
        TransportError::MalformedContainer("payload end overflowed usize".to_owned())
    })?;
    if payload_end > encoded.len() {
        return Err(TransportError::MalformedContainer(format!(
            "declared compressed payload ends at {payload_end}, container length is {}",
            encoded.len()
        )));
    }
    let trailing = encoded.len() - payload_end;
    if trailing != 0 && trailing != 2 {
        return Err(TransportError::MalformedContainer(format!(
            "container has {trailing} trailing bytes; expected zero or two-byte version"
        )));
    }
    Ok(())
}
'''
          new_validator = '''fn validate_encoded_container(
    encoded: &[u8],
    max_encoded_bytes: usize,
    max_decoded_bytes: usize,
) -> TransportResult<()> {
    let (compression, compressed_len, _) =
        validate_encoded_container_envelope(encoded, max_encoded_bytes)?;
    let decoded_len = if compression == 0 {
        compressed_len
    } else {
        u32::from_be_bytes([encoded[5], encoded[6], encoded[7], encoded[8]]) as usize
    };
    if decoded_len > max_decoded_bytes {
        return Err(TransportError::LimitExceeded {
            field: "declared decoded group bytes",
            requested: decoded_len,
            limit: max_decoded_bytes,
        });
    }
    Ok(())
}
'''
          if text.count(old_validator) != 1:
              raise SystemExit(f'validator replacement expected one match, found {text.count(old_validator)}')
          text = text.replace(old_validator, new_validator, 1)

          test_marker = '''    #[test]
    fn container_validation_rejects_unbounded_declared_output_before_decode() {
'''
          if text.count(test_marker) != 1:
              raise SystemExit(f'test insertion marker expected one match, found {text.count(test_marker)}')
          test = '''    #[test]
    fn xtea_container_is_deciphered_before_declared_output_validation() -> TransportResult<()> {
        let keys = [0x1020_3040, 0x5060_7080, 0x90a0_b0c0, 0xd0e0_f000];
        let mut encoded = vec![2, 0, 0, 0, 8, 0, 0, 0, 64];
        encoded.extend_from_slice(&[1, 2, 3, 4, 5, 6, 7, 8]);
        runefs::xtea::encipher(&mut encoded[5..], &keys);

        let prepared = prepare_encoded_container_for_decode(encoded, Some(keys), 1024, 64)?;
        assert_eq!(&prepared[5..9], &64u32.to_be_bytes());
        validate_encoded_container(&prepared, 1024, 64)?;
        Ok(())
    }

'''
          text = text.replace(test_marker, test + test_marker, 1)

          old_legacy = '''        let decoded = cache.read_decoded_group(
            MAP_INDEX,
            loc_group,
            Some(LEGACY_LUMBRIDGE_XTEA),
            usize::MAX,
            usize::MAX,
        )?;
'''
          new_legacy = '''        let decoded = cache.read_decoded_group(
            MAP_INDEX,
            loc_group,
            Some(LEGACY_LUMBRIDGE_XTEA),
            DEFAULT_MAX_ENCODED_GROUP_BYTES,
            DEFAULT_MAX_DECODED_GROUP_BYTES,
        )?;
'''
          if text.count(old_legacy) != 1:
              raise SystemExit(f'legacy XTEA limit patch expected one match, found {text.count(old_legacy)}')
          text = text.replace(old_legacy, new_legacy, 1)

          path.write_text(text)
          PY
          cargo fmt --all

      - name: Verify XTEA validation closure
        run: |
          cargo check --locked --workspace --all-targets --all-features
          cargo test --locked -p osrs-cache
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Commit XTEA validation closure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/osrs-cache/src/transport.rs
          git commit -m "fix: validate XTEA containers after decipher"
          git push origin HEAD:impl/m3-cache-definition-decoding

  tier-a:
    name: Tier A - static quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Check architecture boundaries
        run: python3 scripts/check_architecture.py

      - name: Test architecture guard
        run: python3 scripts/test_check_architecture.py

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check workspace
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  tier-b:
    name: Tier B - fast tests
    runs-on: ubuntu-latest
    needs: tier-a
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Run workspace tests
        run: cargo test --locked --workspace --all-targets --all-features

  tier-c:
    name: Tier C - M3 decode parity
    runs-on: ubuntu-latest
    needs: tier-b
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Run checked-in P0 decode fixtures
        run: cargo test --locked -p osrs-cache --test m3_decode_fixtures

      - name: Run deterministic decoder fuzz smoke
        run: cargo test --locked -p osrs-cache --test m3_fuzz_smoke
