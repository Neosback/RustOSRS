name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-xtea-validation:
    name: M3 XTEA validation closure
    if: github.event_name == 'push' && github.ref == 'refs/heads/impl/m3-cache-definition-decoding' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Apply XTEA validation closure
        run: |
          python3 scripts/m3_xtea_closure.py
          cargo fmt --all

      - name: Verify XTEA validation closure
        run: |
          cargo check --locked --workspace --all-targets --all-features
          cargo test --locked -p osrs-cache
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Commit XTEA validation closure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/osrs-cache/src/transport.rs
          git commit -m "fix: validate XTEA containers after decipher"
          git push origin HEAD:impl/m3-cache-definition-decoding

  tier-a:
    name: Tier A - static quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Check architecture boundaries
        run: python3 scripts/check_architecture.py

      - name: Test architecture guard
        run: python3 scripts/test_check_architecture.py

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check workspace
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  tier-b:
    name: Tier B - fast tests
    runs-on: ubuntu-latest
    needs: tier-a
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Run workspace tests
        run: cargo test --locked --workspace --all-targets --all-features

  tier-c:
    name: Tier C - M3 decode parity
    runs-on: ubuntu-latest
    needs: tier-b
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Run checked-in P0 decode fixtures
        run: cargo test --locked -p osrs-cache --test m3_decode_fixtures

      - name: Run deterministic decoder fuzz smoke
        run: cargo test --locked -p osrs-cache --test m3_fuzz_smoke
