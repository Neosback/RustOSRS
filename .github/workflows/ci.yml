name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tier-a:
    name: Tier A - static quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Check architecture boundaries
        run: python3 scripts/check_architecture.py

      - name: Test architecture guard
        run: python3 scripts/test_check_architecture.py

      - name: Test reference regeneration safety
        run: python3 scripts/test_reference_regeneration.py

      - name: Test historical deob golden index
        run: python3 scripts/test_deob_golden_index.py

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check workspace
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  tier-b:
    name: Tier B - fast tests
    runs-on: ubuntu-latest
    needs: tier-a
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Run workspace tests
        run: cargo test --locked --workspace --all-targets --all-features

  tier-c:
    name: Tier C - semantic parity
    runs-on: ubuntu-latest
    needs: tier-b
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Run checked-in M3 P0 decode fixtures
        run: cargo test --locked -p osrs-cache --test m3_decode_fixtures

      - name: Run M3 deterministic decoder fuzz smoke
        run: cargo test --locked -p osrs-cache --test m3_fuzz_smoke

      - name: Run checked-in M4 fixture inventory
        run: cargo test --locked -p osrs-core --test m4_fixture_manifest

      - name: Run M4 exact model construction fixtures
        run: |
          cargo test --locked -p osrs-core --lib model_construction::tests
          cargo test --locked -p osrs-core --test m4_instance_transform

      - name: Run M4 model decoder fuzz smoke
        run: cargo test --locked -p osrs-cache --test m4_model_fuzz_smoke

      - name: Run M5 repository-wide normalized fixture runner
        run: cargo test --locked -p osrs-reference --test m5_fixture_runner

      - name: Run M6 semantic scene suite
        run: cargo test --locked -p osrs-scene

      - name: Run M7 normals, lighting, and finalization suite
        run: |
          cargo test --locked -p osrs-core --lib normals::tests
          cargo test --locked -p osrs-core --lib lighting::tests
          cargo test --locked -p osrs-reference --test m7_base_normals
          cargo test --locked -p osrs-reference --test m7_normal_merge
          cargo test --locked -p osrs-reference --test m7_lighting
          cargo test --locked -p osrs-reference --test m7_static_entity_lifecycle
          cargo test --locked -p osrs-reference --test m7_initial_scene_finalization
          cargo test --locked -p osrs-reference --test m7_identity_threading
          cargo test --locked -p osrs-reference --test m7_composite_admission
          cargo test --locked -p osrs-scene --test m7_scene_normal_reconciliation
