name: Temporary path network multijoin gate
on:
  push:
    branches:
      - fix/path-network-multijoin
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/path-network-multijoin
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - run: python3 scripts/fix_path_network_multijoin.py
      - name: Preserve endpoint snap tie behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/osrs-editor/src/terrain_path/planner.rs')
          text = path.read_text()
          old = 'if distance < best - 1.0e-9 || ((distance - best).abs() <= 1.0e-9 && earlier) {'
          new = 'if distance < best - 1.0e-9 || (distance == best && earlier) {'
          if old not in text:
              raise SystemExit('snap target tie-break not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - run: cargo fmt --all
      - run: cargo check --locked -p osrs-editor --all-targets --all-features
      - run: cargo clippy --locked -p osrs-editor --all-targets --all-features -- -D warnings
      - run: cargo test --locked -p osrs-editor terrain_path
      - run: rm scripts/fix_path_network_multijoin.py .github/workflows/branch-path-network-multijoin.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(editor): connect path networks at multiple encounters"
          git push origin HEAD:fix/path-network-multijoin
