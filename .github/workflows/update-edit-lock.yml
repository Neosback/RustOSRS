name: Update edit-domain lockfile

on:
  push:
    branches:
      - refactor/editor-edit-domain-foundation

permissions:
  contents: write

jobs:
  update-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: refactor/editor-edit-domain-foundation

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Regenerate workspace lockfile
        run: cargo generate-lockfile

      - name: Commit lockfile if changed
        shell: bash
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore(editor): refresh workspace lockfile"
          git push origin HEAD:refactor/editor-edit-domain-foundation
