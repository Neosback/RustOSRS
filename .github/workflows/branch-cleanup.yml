name: Finish terrain path cleanup

on:
  push:
    branches:
      - fix/spline-path-reliability

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/spline-path-reliability
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - run: python3 scripts/finish_terrain_path_cleanup.py
      - run: cargo fmt --all
      - run: rm scripts/finish_terrain_path_cleanup.py .github/workflows/branch-cleanup.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(editor): finish terrain path migration cleanup"
          git push origin HEAD:fix/spline-path-reliability
