name: Normalize edit-domain lockfile

on:
  push:
    branches:
      - refactor/editor-edit-domain-foundation

permissions:
  contents: write

jobs:
  normalize-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: refactor/editor-edit-domain-foundation
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Restore baseline lockfile and minimally refresh
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- Cargo.lock
          cargo check --workspace --all-targets --all-features
          cargo check --locked --workspace --all-targets --all-features

      - name: Commit normalized lockfile if changed
        shell: bash
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already normalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore(editor): normalize foundation lockfile"
          git push origin HEAD:refactor/editor-edit-domain-foundation
