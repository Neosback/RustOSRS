name: Add terrain path continuity repair

on:
  push:
    branches:
      - fix/spline-path-reliability

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/spline-path-reliability
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - run: python3 scripts/gate_path_continuity_repair.py
      - run: cargo fmt --all
      - run: "cargo test --locked -p osrs-editor terrain_path"
      - run: rm scripts/add_path_continuity_repair.py scripts/gate_path_continuity_repair.py .github/workflows/branch-continuity.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(editor): repair terrain path topology continuity"
          git push origin HEAD:fix/spline-path-reliability
