name: Editor simple path fitter migration

on:
  push:
    branches:
      - refactor/editor-path-commit-domain

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply scoped migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_simple_path_fitter.py')
          text = path.read_text()
          text = text.replace(
              "profile_start = spline.index('    /// A profile for the planner:', overlay_start)",
              "profile_start = spline.index('    /// A profile for the planner:')",
          )
          text = text.replace(
              "plan_fn_start = spline.index('    fn plan_input(&self) -> Option<PlanInput> {', plan_input_comment)",
              "plan_fn_start = spline.index('    fn plan_input(&self) -> Option<PlanInput> {')",
          )
          path.write_text(text)
          PY
          python3 scripts/apply_simple_path_fitter.py
      - name: Format, test compile, and commit
        shell: bash
        run: |
          cargo fmt --all
          cargo check --workspace
          cargo test -p osrs-editor terrain_path::fitter --lib
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(editor): replace path planner with overlay fitter'
          git push
