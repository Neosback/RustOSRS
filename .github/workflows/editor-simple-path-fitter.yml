name: Editor simple path fitter migration

on:
  push:
    branches:
      - refactor/editor-path-commit-domain

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply scoped migration
        run: python3 scripts/apply_simple_path_fitter.py
      - name: Format, test compile, and commit
        shell: bash
        run: |
          cargo fmt --all
          cargo check --workspace
          cargo test -p osrs-editor terrain_path::fitter --lib
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(editor): replace path planner with overlay fitter'
          git push
