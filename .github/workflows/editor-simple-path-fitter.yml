name: Editor simple path fitter migration

on:
  push:
    branches:
      - refactor/editor-path-commit-domain

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply scoped migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_simple_path_fitter.py')
          text = path.read_text()
          text = text.replace(
              "profile_start = spline.index('    /// A profile for the planner:', overlay_start)",
              "profile_start = spline.index('    /// A profile for the planner:')",
          )
          text = text.replace(
              "plan_fn_start = spline.index('    fn plan_input(&self) -> Option<PlanInput> {', plan_input_comment)",
              "plan_fn_start = spline.index('    fn plan_input(&self) -> Option<PlanInput> {')",
          )
          path.write_text(text)
          PY
          python3 scripts/apply_simple_path_fitter.py
          python3 - <<'PY'
          from pathlib import Path

          settings = Path('crates/osrs-editor/src/app/settings_io.rs')
          text = settings.read_text()
          start = text.index('fn finite_f32_or(')
          end = text.index('impl EditorApp {', start)
          replacement = '''fn finite_f32_or(value: f32, fallback: f32) -> f32 {
              if value.is_finite() { value } else { fallback }
          }

          /// Clamp persisted Spline settings to the same narrow domain the simplified UI exposes.
          fn sanitize_loaded_settings(settings: Settings) -> Settings {
              let mut settings = settings.sanitized();
              let defaults = crate::paint::SplineSettings::default();
              let spline = &mut settings.spline;
              spline.width = finite_f32_or(spline.width, defaults.width).clamp(0.5, 24.0);
              spline.edge_weight =
                  finite_f32_or(spline.edge_weight, defaults.edge_weight).clamp(0.0, 2.0);
              settings
          }

          '''
          settings.write_text(text[:start] + replacement + text[end:])

          workspace = Path('crates/osrs-editor/src/app/workspace.rs')
          text = workspace.read_text()
          start = text.index('            Tool::Spline => {')
          end = text.index('            Tool::Height => {', start)
          replacement = '''            Tool::Spline => {
              crate::theme::section_heading(ui, "Path");
              ui.horizontal(|ui| {
                  ui.weak("Width");
                  ui.add(
                      egui::DragValue::new(&mut self.prefs.spline.width)
                          .range(0.5..=24.0)
                          .speed(0.1)
                          .suffix(" tiles"),
                  );
                  ui.weak("Edge");
                  ui.add(
                      egui::DragValue::new(&mut self.prefs.spline.edge_weight)
                          .range(0.0..=2.0)
                          .speed(0.05),
                  );
              });
          }
'''
          workspace.write_text(text[:start] + replacement + text[end:])
          PY
      - name: Format, test compile, and commit
        shell: bash
        run: |
          cargo fmt --all
          cargo check --workspace
          cargo test -p osrs-editor terrain_path::fitter --lib
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(editor): replace path planner with overlay fitter'
          git push
