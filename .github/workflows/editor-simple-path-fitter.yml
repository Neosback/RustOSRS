name: Editor simple path fitter migration

on:
  push:
    branches:
      - refactor/editor-path-commit-domain

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply scoped migration
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("scripts/apply_simple_path_fitter.py"); t=p.read_text(); t=t.replace("profile_start = spline.index(\047    /// A profile for the planner:\047, overlay_start)", "profile_start = spline.index(\047    /// A profile for the planner:\047)"); t=t.replace("plan_fn_start = spline.index(\047    fn plan_input(&self) -> Option<PlanInput> {\047, plan_input_comment)", "plan_fn_start = spline.index(\047    fn plan_input(&self) -> Option<PlanInput> {\047)"); p.write_text(t)'
          python3 scripts/apply_simple_path_fitter.py
          python3 scripts/fix_simple_path_followups.py
      - name: Format, test compile, and commit
        shell: bash
        run: |
          cargo fmt --all
          cargo check --workspace
          cargo test -p osrs-editor terrain_path::fitter
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(editor): replace path planner with overlay fitter'
          git push
