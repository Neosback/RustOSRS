name: CP2 Stopping Point Finalizer

# One-shot documentation finalizer. It records the deliberate CP2 stopping point in the roadmap.
# This workflow is deleted before merge.
on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: cp2-stopping-point-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize-roadmap:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Mark deliberate merge stopping point
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/plans/ARCHITECTURE-AI-FOUNDATION.md")
          text = path.read_text(encoding="utf-8")

          replacements = {
              "Status: active incremental refactor plan":
                  "Status: deliberate merge stopping point after CP2 semantic authority cleanup; CP3+ deferred to future work",
              "11. Merge only after the complete roadmap's merge-readiness checkpoint succeeds.":
                  "11. For a deliberate stopping-point merge, integrate only after merge-readiness checks for the implemented scope succeed and deferred roadmap phases are recorded explicitly.",
              "### CP2 - semantic authority and duplicate chronology cleanup - ACTIVE":
                  "### CP2 - semantic authority and duplicate chronology cleanup - COMPLETE AT MERGE STOPPING POINT",
              "#### CP2G / Replay R3B - wire semantic descriptor into active replay routing - NEXT":
                  "#### CP2G / Replay R3B - wire semantic descriptor into active replay routing - COMPLETE",
              "#### CP2H / Replay R4A - remove parallel chronological marker stacks":
                  "#### CP2H / Replay R4A - remove parallel chronological marker stacks - COMPLETE",
              "#### CP2I / Replay R4B - remove obsolete tool-specific replay projection code":
                  "#### CP2I / Replay R4B - remove obsolete tool-specific replay projection code - COMPLETE",
              "#### CP2J / Replay R5 - authority ratchets and architecture dashboard baseline":
                  "#### CP2J / Replay R5 - authority ratchets and architecture dashboard baseline - COMPLETE",
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one roadmap marker {old!r}, found {count}")
              text = text.replace(old, new, 1)

          anchor = "Baseline main: `ff7a1be7020f6202987beaef2c792b569c8164da`\n"
          note = """

## Deliberate stopping-point decision - 2026-10-19

This branch is being integrated into `main` after the CP2 semantic-authority, replay, chronology, authority-ratchet, and architecture-dashboard work reached a coherent boundary. CP3 through CP11 remain useful roadmap work, but they are explicitly deferred to future branches and are not blockers for this stopping-point merge.

The merge-readiness requirement for this stop is the implemented scope: canonical authority checks, feature/architecture guards, semantic replay/history coverage, repository formatting, focused editor/edit validation, and normal repository CI on the final branch head. No unfinished CP3+ implementation is being partially merged under this decision.
"""
          if "## Deliberate stopping-point decision - 2026-10-19" not in text:
              if text.count(anchor) != 1:
                  raise SystemExit("could not locate baseline-main anchor for stopping-point note")
              text = text.replace(anchor, anchor + note, 1)

          path.write_text(text, encoding="utf-8")
          PY
          git diff --check
      - name: Commit stopping-point roadmap
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Roadmap already finalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/plans/ARCHITECTURE-AI-FOUNDATION.md
          git commit -m "docs: mark architecture foundation stopping point"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
