name: CP2 Build Validation

# Temporary draft-PR harness for the CP2 semantic-history cleanup. The repository currently has
# unrelated workspace-wide rustfmt and strict test-Clippy debt on main, so this gate validates CP2
# production code strictly and executes the affected package tests without linting unrelated tests.
# Remove this workflow after the checkpoint is proven.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cp2-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  RUST_BACKTRACE: short
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
          rustflags: ""
      - name: Linux build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -qq -y --no-install-recommends pkg-config libasound2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: CP2 rustfmt diagnostics
        run: |
          rustfmt --edition 2024 --check \
            crates/osrs-edit/src/replay.rs \
            crates/osrs-editor/src/app/editing/commit.rs \
            crates/osrs-editor/src/app/editing/history/replay_projection.rs \
            crates/osrs-editor/src/app/editing/history/routing.rs \
            crates/osrs-editor/src/app/editing/history/routing/tests.rs \
            crates/osrs-editor/src/app/editing/tests.rs || true
      - name: Strict production Clippy
        run: cargo clippy --locked -p osrs-edit -p osrs-editor --lib --all-features -- -D warnings
      - name: Focused package tests
        shell: bash
        run: |
          set +e
          python3 scripts/run_tests.py -p osrs-edit -p osrs-editor --output target/verify/cp2-tests
          status=$?
          if [ "$status" -ne 0 ] && [ -f target/verify/cp2-tests/build.jsonl ]; then
            python3 - <<'PY'
          import json
          from pathlib import Path

          for line in Path("target/verify/cp2-tests/build.jsonl").read_text(encoding="utf-8").splitlines():
              try:
                  row = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if row.get("reason") != "compiler-message":
                  continue
              message = row.get("message", {})
              if message.get("level") == "error":
                  print(message.get("rendered") or message.get("message", "compiler error"))
          PY
          fi
          exit "$status"
      - name: Focused wasm Clippy
        run: cargo clippy --locked --target wasm32-unknown-unknown -p osrs-edit -p osrs-editor -- -D warnings
