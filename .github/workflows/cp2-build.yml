name: CP2 Build Validation

# Temporary draft-PR harness for the CP2 semantic-history cleanup. The repository currently has
# unrelated workspace-wide rustfmt and osrs-lab test-lint debt on main, so this gate validates only
# the crates and Rust files changed by CP2. Remove this workflow after the checkpoint is proven.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cp2-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  RUST_BACKTRACE: short
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
          rustflags: ""
      - name: Linux build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -qq -y --no-install-recommends pkg-config libasound2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: CP2 rustfmt diagnostics
        run: |
          rustfmt --edition 2024 --check \
            crates/osrs-edit/src/replay.rs \
            crates/osrs-editor/src/app/editing/commit.rs \
            crates/osrs-editor/src/app/editing/history/replay_projection.rs \
            crates/osrs-editor/src/app/editing/history/routing.rs \
            crates/osrs-editor/src/app/editing/history/routing/tests.rs \
            crates/osrs-editor/src/app/editing/tests.rs || true
      - name: Focused native Clippy and tests
        run: python3 scripts/verify.py -p osrs-edit -p osrs-editor --stage build
      - name: Focused wasm Clippy
        run: cargo clippy --locked --target wasm32-unknown-unknown -p osrs-edit -p osrs-editor -- -D warnings
