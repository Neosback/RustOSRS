name: CP2 Merge Prep

# One-shot merge-preparation harness. It fixes the final stale replay test caller and applies the
# repository formatter, commits only those mechanical changes, and is deleted before merge.
on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: cp2-merge-prep-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format-and-fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
      - name: Apply merge-prep fix and formatting
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/osrs-editor/src/app/prefab_studio/catalog/tests.rs")
          text = path.read_text(encoding="utf-8")
          old = """        .replay(\n            crate::app::edit_runtime::EditReplayDirection::Redo,\n            crate::app::edit_runtime::EditFootprint::default(),\n            |_| Ok::<_, ()>(()),\n        )\n"""
          new = """        .replay(\n            crate::app::edit_runtime::EditReplayDirection::Redo,\n            |_| Ok::<_, ()>(()),\n        )\n"""
          count = text.count(old)
          if count not in (0, 1):
              raise SystemExit(f"expected zero or one stale replay caller, found {count}")
          if count == 1:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          cargo fmt --all
          git diff --check
      - name: Commit mechanical merge prep
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No merge-prep changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: format architecture merge checkpoint"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
