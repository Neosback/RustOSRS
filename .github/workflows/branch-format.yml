name: Temporary branch formatter

on:
  push:
    branches:
      - fix/spline-path-reliability

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: fix/spline-path-reliability

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Format workspace
        run: cargo fmt --all

      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: format terrain path migration"
          git push origin HEAD:fix/spline-path-reliability
