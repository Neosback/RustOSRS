name: Rust Renderer

on:
  push:
    branches:
      - main
      - feature/rust-renderer-core
    paths:
      - "client/rust-renderer/**"
      - "client/render/rust/**"
      - "client/render/shaders/**"
      - "client/render/WebGLOsrsRenderer.ts"
      - "client/render/gfx/GfxRenderer.ts"
      - "client/render/player/PlayerRenderer.ts"
      - "client/render/projectiles/ProjectileRenderer.ts"
      - "client/render/render/draw2.ts"
      - "client/render/render/frame/render.ts"
      - "client/render/render/frame/render3.ts"
      - "client/render/render/frame/render4.ts"
      - "client/render/render/frame/render5.ts"
      - "client/tests/rust-renderer-shadow-integration.test.ts"
      - "client/tests/rust-renderer-bridge.test.ts"
      - "client/scripts/check-rust-renderer-abi.mjs"
      - "client/scripts/check-rust-renderer-shader-reference.mjs"
      - "client/package.json"
      - "client/yarn.lock"
      - ".github/workflows/rust-renderer.yml"
  pull_request:
    paths:
      - "client/rust-renderer/**"
      - "client/render/rust/**"
      - "client/render/shaders/**"
      - "client/render/WebGLOsrsRenderer.ts"
      - "client/render/gfx/GfxRenderer.ts"
      - "client/render/player/PlayerRenderer.ts"
      - "client/render/projectiles/ProjectileRenderer.ts"
      - "client/render/render/draw2.ts"
      - "client/render/render/frame/render.ts"
      - "client/render/render/frame/render3.ts"
      - "client/render/render/frame/render4.ts"
      - "client/render/render/frame/render5.ts"
      - "client/tests/rust-renderer-shadow-integration.test.ts"
      - "client/tests/rust-renderer-bridge.test.ts"
      - "client/scripts/check-rust-renderer-abi.mjs"
      - "client/scripts/check-rust-renderer-shader-reference.mjs"
      - "client/package.json"
      - "client/yarn.lock"
      - ".github/workflows/rust-renderer.yml"

jobs:
  renderer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/rust-renderer
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt,clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Native tests
        run: cargo test --all-targets
      - name: Native clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: WASM check
        run: cargo check --target wasm32-unknown-unknown
      - name: Package browser WASM
        run: node ../scripts/build-rust-renderer.mjs

  bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable Corepack
        run: corepack enable
      - name: Install client dependencies
        run: yarn install --immutable
      - name: Check renderer ABI alignment
        run: yarn check:rust-renderer-abi
      - name: Guard legacy shader parity reference
        run: yarn check:rust-renderer-shaders
      - name: Test TypeScript bridge
        run: yarn test:rust-renderer-bridge
      - name: Test shadow integration module graph
        run: yarn test:rust-renderer-shadow
