name: Rust Renderer

on:
  push:
    branches:
      - main
    paths:
      - "client/rust-renderer/**"
      - "client/render/**"
      - "client/ui/devoverlay/WidgetsOverlay.ts"
      - "client/game/worker/**"
      - "client/game/OsrsClientApp.tsx"
      - "client/common/debug/RuntimePerfCounters.ts"
      - "client/common/utils/BoundedLru.ts"
      - "client/rs/cache/js5/**"
      - "client/tests/worker-cache-lru.test.ts"
      - "client/tests/map-file-loader-errors.test.ts"
      - "client/tests/terrain-batch-bridge.test.ts"
      - "client/tests/js5-*.test.ts"
      - "client/rs/model/**"
      - "client/tests/runtime-perf-counters.test.ts"
      - "client/tests/rust-renderer-shadow-integration.test.ts"
      - "client/tests/rust-renderer-bridge.test.ts"
      - "client/tests/rust-stage5-ownership.test.ts"
      - "client/tests/rust-model-lighting-integration.test.ts"
      - "client/scripts/check-rust-renderer-abi.mjs"
      - "client/scripts/check-rust-renderer-shader-reference.mjs"
      - "client/scripts/check-rust-primary-ownership.mjs"
      - "client/scripts/test-rust-renderer-browser.mjs"
      - "client/scripts/test-rust-stage5-parity.mjs"
      - "client/package.json"
      - "client/craco.config.js"
      - "client/vercel.json"
      - "client/tests/runtime-stabilization.test.ts"
      - "client/yarn.lock"
      - ".github/workflows/rust-renderer.yml"
  pull_request:
    paths:
      - "client/rust-renderer/**"
      - "client/render/**"
      - "client/ui/devoverlay/WidgetsOverlay.ts"
      - "client/game/worker/**"
      - "client/game/OsrsClientApp.tsx"
      - "client/common/debug/RuntimePerfCounters.ts"
      - "client/common/utils/BoundedLru.ts"
      - "client/rs/cache/js5/**"
      - "client/tests/worker-cache-lru.test.ts"
      - "client/tests/map-file-loader-errors.test.ts"
      - "client/tests/terrain-batch-bridge.test.ts"
      - "client/tests/js5-*.test.ts"
      - "client/rs/model/**"
      - "client/tests/runtime-perf-counters.test.ts"
      - "client/tests/rust-renderer-shadow-integration.test.ts"
      - "client/tests/rust-renderer-bridge.test.ts"
      - "client/tests/rust-stage5-ownership.test.ts"
      - "client/tests/rust-model-lighting-integration.test.ts"
      - "client/scripts/check-rust-renderer-abi.mjs"
      - "client/scripts/check-rust-renderer-shader-reference.mjs"
      - "client/scripts/check-rust-primary-ownership.mjs"
      - "client/scripts/test-rust-renderer-browser.mjs"
      - "client/scripts/test-rust-stage5-parity.mjs"
      - "client/package.json"
      - "client/craco.config.js"
      - "client/vercel.json"
      - "client/tests/runtime-stabilization.test.ts"
      - "client/yarn.lock"
      - ".github/workflows/rust-renderer.yml"

jobs:
  renderer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/rust-renderer
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt,clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Native tests
        run: cargo test --all-targets
      - name: Native clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: WASM check
        run: cargo check --target wasm32-unknown-unknown
      - name: Package browser WASM
        run: node ../scripts/build-rust-renderer.mjs
      - name: Stage 5 WASM parity
        run: node ../scripts/test-rust-stage5-parity.mjs
      - name: Browser WASM/WebGL2 acceptance
        run: node ../scripts/test-rust-renderer-browser.mjs

  bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable Corepack
        run: corepack enable
      - name: Install client dependencies
        run: yarn install --immutable
      - name: TypeScript typecheck
        run: yarn typecheck
      - name: Runtime stabilization regressions
        run: yarn exec tsx tests/runtime-stabilization.test.ts
      - name: Runtime performance counter regressions
        run: yarn exec tsx tests/runtime-perf-counters.test.ts
      - name: Worker bounded-cache regressions
        run: yarn exec tsx tests/worker-cache-lru.test.ts
      - name: Map file loader error regressions
        run: yarn exec tsx tests/map-file-loader-errors.test.ts
      - name: Terrain batch bridge regressions
        run: yarn exec tsx tests/terrain-batch-bridge.test.ts
      - name: JS5 range scheduling regressions
        run: yarn exec tsx tests/js5-range-batching.test.ts
      - name: Worker JS5 coordinator regressions
        run: yarn exec tsx tests/js5-coordinator.test.ts
      - name: Production client build
        env:
          CI: "false"
          NODE_ENV: "production"
          DISABLE_ESLINT_PLUGIN: "true"
        run: yarn exec craco build
      - name: Check renderer ABI alignment
        run: yarn check:rust-renderer-abi
      - name: Guard legacy shader parity reference
        run: yarn check:rust-renderer-shaders
      - name: Guard Rust-primary scene ownership
        run: yarn check:rust-primary-ownership
      - name: Test TypeScript bridge
        run: yarn test:rust-renderer-bridge
      - name: Test Stage 5 Rust ownership
        run: yarn test:rust-stage5-ownership
      - name: Test ModelData Rust lighting
        run: yarn test:rust-model-lighting
      - name: Test shadow integration module graph
        run: yarn test:rust-renderer-shadow
