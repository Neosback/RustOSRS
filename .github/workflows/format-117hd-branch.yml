name: Format 117HD branch

on:
  push:
    branches:
      - impl/117hd-material-terrain-parity

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: impl/117hd-material-terrain-parity

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false

      - name: Format workspace
        run: cargo fmt --all

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "style: format 117HD parity changes"
          git push origin HEAD:impl/117hd-material-terrain-parity
