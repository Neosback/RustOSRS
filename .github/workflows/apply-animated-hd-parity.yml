name: Apply animated HD parity

on:
  push:
    branches:
      - "impl/117hd-material-terrain-parity"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: "impl/117hd-material-terrain-parity"
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Fix staged import
        run: sed -i 's/    AnimatedHdState, AnimatedInstance,/    animation::AnimatedHdState, AnimatedInstance,/' scripts/apply_animated_hd_parity.py
      - name: Apply patch
        run: python3 scripts/apply_animated_hd_parity.py
      - name: Update reference example
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("crates/osrs-world/examples/render_frame.rs")
          text = path.read_text()
          old = "extract_animated_instances(&world, None)"
          if text.count(old) != 1:
              raise SystemExit(f"expected one render_frame animation extraction call, got {text.count(old)}")
          path.write_text(text.replace(old, "extract_animated_instances(&world, None, None)", 1))
          PY
      - name: Format
        run: cargo fmt --all
      - name: Check
        run: cargo check --locked --workspace --all-targets --all-features
      - name: Commit
        run: |
          rm .github/workflows/apply-animated-hd-parity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(hd): route animated locs through HD materials"
          git push origin HEAD:impl/117hd-material-terrain-parity
