name: Temporary spline preview Clippy fix
on:
  push:
    branches:
      - fix/spline-preview-coalescing
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/spline-preview-coalescing
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - run: python3 scripts/fix_spline_preview_coalescing.py
      - run: sed -i 's/color\.a()\.saturating_div(3)/color.a() \/ 3/' crates/osrs-editor/src/app/spline_tool.rs
      - name: Use an Option for failed worker sends
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/osrs-editor/src/app/spline_tool.rs')
          s = p.read_text()
          old = '''    fn request(&mut self, input: PlanInput) -> Result<(), PlanInput> {
              if input.key == self.requested_key {
                  return Ok(());
              }
              let key = input.key;
              match self.request.send(input) {
                  Ok(()) => {
                      self.requested_key = key;
                      Ok(())
                  }
                  Err(error) => Err(error.0),
              }
          }
          '''
          new = '''    fn request(&mut self, input: PlanInput) -> Option<PlanInput> {
              if input.key == self.requested_key {
                  return None;
              }
              let key = input.key;
              match self.request.send(input) {
                  Ok(()) => {
                      self.requested_key = key;
                      None
                  }
                  Err(error) => Some(error.0),
              }
          }
          '''
          if old not in s:
              raise SystemExit('request method block not found')
          s = s.replace(old, new, 1)
          s = s.replace(
              '.and_then(|worker| worker.request(input).err())',
              '.and_then(|worker| worker.request(input))',
              1,
          )
          p.write_text(s)
          PY
      - run: cargo fmt --all
      - run: cargo check --locked -p osrs-editor --all-targets --all-features
      - run: cargo clippy --locked -p osrs-editor --all-targets --all-features -- -D warnings
      - run: cargo test --locked -p osrs-editor terrain_path
      - run: rm scripts/fix_spline_preview_coalescing.py .github/workflows/branch-spline-preview.yml .github/workflows/branch-spline-preview-fix.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(editor): coalesce spline preview planning"
          git push origin HEAD:fix/spline-preview-coalescing
