name: M4 Checkpoint 2 Format Verify

on:
  push:
    branches:
      - impl/m4-model-decode-construction
    paths:
      - .github/workflows/m4-checkpoint2-format-verify.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: impl/m4-model-decode-construction
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Apply decoder cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/osrs-cache/src/decode/model.rs')
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              assert text.count(old) == 1, old[:80]
              text = text.replace(old, new)

          replace_once(
              '''use super::{\n    ArchiveFileProvenance, BinaryReader, ByteSpan, DecodeError, DecodeErrorKind, DecodeResult,\n    DecodeSubject, DecoderContext,\n};''',
              '''use super::{\n    ArchiveFileProvenance, BinaryReader, ByteSpan, DecodeResult, DecodeSubject, DecoderContext,\n};''',
          )

          replace_once(
              '''const FFFD_FOOTER_LEN: usize = 26;\nconst FFFE_FOOTER_LEN: usize = 23;''',
              '''const FFFD_FOOTER_LEN: usize = 26;\nconst FFFE_FOOTER_LEN: usize = 23;\n\ntype DecodedVertexData = (\n    Vec<ModelPoint>,\n    Option<Vec<i32>>,\n    Option<Vec<Option<SkeletalVertexData>>>,\n);''',
          )

          replace_once(
              '''    let mut face_colors = Vec::with_capacity(face_count);\n    let mut face_render_types = has_packed_face_info.then(|| Vec::with_capacity(face_count));\n    let mut decoded_priorities = face_priorities;\n    let mut face_alphas = has_face_alphas.then(|| Vec::with_capacity(face_count));\n    let mut face_skins = has_face_skins.then(|| Vec::with_capacity(face_count));\n    let mut face_textures = has_packed_face_info.then(|| Vec::with_capacity(face_count));\n    let mut texture_face_selectors = has_packed_face_info.then(|| Vec::with_capacity(face_count));\n\n    for face in 0..face_count {\n        let raw_color = colors.read_u16_be()?;\n        if has_packed_face_info {\n            let info = packed.read_u8()?;\n            face_render_types.as_mut().expect("allocated above").push(if info & 1 == 1 { 1 } else { 0 });\n            if info & 2 == 2 {\n                let texture = (raw_color != u16::MAX).then(|| TextureId::new(u32::from(raw_color)));\n                face_textures.as_mut().expect("allocated above").push(texture);\n                texture_face_selectors\n                    .as_mut()\n                    .expect("allocated above")\n                    .push(texture.map(|_| TextureTriangleIndex::new(u32::from(info >> 2))));\n                face_colors.push(127);\n            } else {\n                face_textures.as_mut().expect("allocated above").push(None);\n                texture_face_selectors.as_mut().expect("allocated above").push(None);\n                face_colors.push(raw_color);\n            }\n        } else {\n            face_colors.push(raw_color);\n        }''',
              '''    let mut face_colors = Vec::with_capacity(face_count);\n    let mut packed_render_types = Vec::with_capacity(face_count);\n    let mut decoded_priorities = face_priorities;\n    let mut face_alphas = has_face_alphas.then(|| Vec::with_capacity(face_count));\n    let mut face_skins = has_face_skins.then(|| Vec::with_capacity(face_count));\n    let mut packed_face_textures = Vec::with_capacity(face_count);\n    let mut packed_texture_selectors = Vec::with_capacity(face_count);\n\n    for face in 0..face_count {\n        let raw_color = colors.read_u16_be()?;\n        if has_packed_face_info {\n            let info = packed.read_u8()?;\n            packed_render_types.push(if info & 1 == 1 { 1 } else { 0 });\n            if info & 2 == 2 {\n                let texture = (raw_color != u16::MAX).then(|| TextureId::new(u32::from(raw_color)));\n                packed_face_textures.push(texture);\n                packed_texture_selectors\n                    .push(texture.map(|_| TextureTriangleIndex::new(u32::from(info >> 2))));\n                face_colors.push(127);\n            } else {\n                packed_face_textures.push(None);\n                packed_texture_selectors.push(None);\n                face_colors.push(raw_color);\n            }\n        } else {\n            face_colors.push(raw_color);\n        }''',
          )

          old = '''    let faces = decode_faces(\n        &root,'''
          new = '''    let face_render_types = has_packed_face_info.then_some(packed_render_types);\n    let face_textures = has_packed_face_info.then_some(packed_face_textures);\n    let texture_face_selectors = has_packed_face_info.then_some(packed_texture_selectors);\n\n    let faces = decode_faces(\n        &root,'''
          assert text.count(old) == 2
          first = text.find(old)
          second = text.find(old, first + 1)
          text = text[:second] + text[second:].replace(old, new, 1)

          replace_once(
              ''') -> DecodeResult<(\n    Vec<ModelPoint>,\n    Option<Vec<i32>>,\n    Option<Vec<Option<SkeletalVertexData>>>,\n)> {''',
              ''') -> DecodeResult<DecodedVertexData> {''',
          )

          replace_once(
              '''mod tests {\n    use super::*;\n    use crate::decode::test_support;''',
              '''mod tests {\n    use super::*;\n    use crate::decode::{test_support, DecodeErrorKind};''',
          )

          replace_once(
              '''            let error = decode_model_data(bytes, &context, &model_source(), ModelId::new(9))\n                .expect_err("unsupported model family unexpectedly decoded");''',
              '''            let error = match decode_model_data(bytes, &context, &model_source(), ModelId::new(9)) {\n                Err(error) => error,\n                Ok(_) => return Err("unsupported model family unexpectedly decoded".into()),\n            };''',
          )

          replace_once(
              '''            let error = decode_model_data(bytes, &context, &model_source(), ModelId::new(42))\n                .expect_err("truncated model unexpectedly decoded");''',
              '''            let error = match decode_model_data(bytes, &context, &model_source(), ModelId::new(42)) {\n                Err(error) => error,\n                Ok(_) => return Err("truncated model unexpectedly decoded".into()),\n            };''',
          )

          path.write_text(text)
          PY
      - name: Format and verify decoder
        run: |
          cargo fmt --all
          cargo check --locked --workspace --all-targets --all-features
          cargo test --locked -p osrs-cache --lib
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Commit verified cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/osrs-cache/src/decode/model.rs crates/osrs-cache/src/decode/mod.rs
          if ! git diff --cached --quiet; then
            git commit -m "fix: harden M4 model decoder"
            git push origin HEAD:impl/m4-model-decode-construction
          fi
