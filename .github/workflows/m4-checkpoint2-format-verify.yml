name: M4 Checkpoint 2 Format Verify

on:
  push:
    branches:
      - impl/m4-model-decode-construction
    paths:
      - .github/workflows/m4-checkpoint2-format-verify.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: impl/m4-model-decode-construction
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Format and verify decoder
        run: |
          cargo fmt --all
          cargo check --locked --workspace --all-targets --all-features
          cargo test --locked -p osrs-cache --lib
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Commit formatter output if needed
        run: |
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add crates/osrs-cache/src/decode/model.rs crates/osrs-cache/src/decode/mod.rs
            git commit -m "style: format M4 model decoder"
            git push origin HEAD:impl/m4-model-decode-construction
          fi
