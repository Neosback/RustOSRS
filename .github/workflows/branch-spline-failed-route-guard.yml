name: Temporary spline failed-route guard
on:
  push:
    branches:
      - fix/spline-block-failed-routes
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/spline-block-failed-routes
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - run: python3 scripts/fix_spline_failed_route_commit.py
      - run: cargo fmt --all
      - run: cargo check --locked -p osrs-editor --all-targets --all-features
      - run: cargo clippy --locked -p osrs-editor --all-targets --all-features -- -D warnings
      - run: cargo test --locked -p osrs-editor spline_tool
      - run: cargo test --locked -p osrs-editor terrain_path
      - run: rm scripts/fix_spline_failed_route_commit.py .github/workflows/branch-spline-failed-route-guard.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(editor): refuse to lay paths with failed routes"
          git push origin HEAD:fix/spline-block-failed-routes
