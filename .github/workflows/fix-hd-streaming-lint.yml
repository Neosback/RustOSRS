name: Fix HD streaming lint

on:
  push:
    branches:
      - impl/117hd-material-terrain-parity

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: impl/117hd-material-terrain-parity

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false

      - name: Apply targeted lint fix and remove helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/osrs-world/src/streaming.rs')
          text = path.read_text()
          old = 'for face in vertices.chunks_exact(3) {'
          new = 'for face in vertices.as_chunks::<3>().0 {'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one target, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          rm .github/workflows/fix-hd-streaming-lint.yml
          cargo fmt --all

      - name: Commit targeted fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/osrs-world/src/streaming.rs .github/workflows/fix-hd-streaming-lint.yml
          git commit -m "style(hd): use fixed-size triangle chunks"
          git push origin HEAD:impl/117hd-material-terrain-parity
