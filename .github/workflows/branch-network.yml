name: Add terrain path network autoconnect

on:
  push:
    branches:
      - fix/spline-path-reliability

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/spline-path-reliability
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - run: python3 scripts/add_network_autoconnect.py
      - run: cargo fmt --all
      - run: cargo test --locked -p osrs-editor terrain_path::planner::tests::network_policy_adds_an_interior_connector_without_bending_the_main_line
      - run: rm scripts/add_network_autoconnect.py .github/workflows/branch-network.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(editor): make network autoconnect create interior branches"
          git push origin HEAD:fix/spline-path-reliability
