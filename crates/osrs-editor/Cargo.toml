[package]
name = "osrs-editor"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
osrs-core = { path = "../osrs-core" }
osrs-cache = { path = "../osrs-cache" }
osrs-scene = { path = "../osrs-scene" }
osrs-render = { path = "../osrs-render" }
osrs-hd = { path = "../osrs-hd" }
osrs-world = { path = "../osrs-world" }
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts"] }
wgpu.workspace = true
web-time.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0.152"
egui-phosphor = "0.14.0"
egui-elegance = "0.16.2"
transform-gizmo-egui = "0.11.0"
mint = "0.5"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
memory-stats = "1.2.0"
open = "5.4.4"
rfd = "0.15"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Element"] }
console_error_panic_hook = "0.1"
getrandom = { version = "0.3", features = ["wasm_js"] }

[lints]
workspace = true
