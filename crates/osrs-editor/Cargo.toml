[package]
name = "osrs-editor"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
osrs-core = { path = "../osrs-core" }
osrs-cache = { path = "../osrs-cache" }
osrs-scene = { path = "../osrs-scene" }
osrs-render = { path = "../osrs-render" }
osrs-hd = { path = "../osrs-hd" }
osrs-world = { path = "../osrs-world" }
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
wgpu.workspace = true
memory-stats = "1.2.0"
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0.152"
egui-phosphor = "0.14.0"
open = "5.4.4"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }

[lints]
workspace = true
