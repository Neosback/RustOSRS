[workspace]
resolver = "3"
members = [
    "crates/osrs-core",
    "crates/osrs-edit",
    "crates/osrs-cache",
    "crates/osrs-filestore",
    "crates/osrs-scene",
    "crates/osrs-render",
    "crates/osrs-reference",
    "crates/osrs-world",
    "crates/osrs-editor",
    "crates/osrs-hd",
]
default-members = [
    "crates/osrs-core",
    "crates/osrs-edit",
    "crates/osrs-cache",
    "crates/osrs-filestore",
    "crates/osrs-scene",
    "crates/osrs-render",
    "crates/osrs-reference",
    "crates/osrs-world",
    "crates/osrs-editor",
    "crates/osrs-hd",
]

[workspace.package]
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "1.0"
wgpu = "30"
osrs-filestore = { path = "crates/osrs-filestore" }
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml_ng = "0.10.0"
sha2 = "0.10"
web-time = "1.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"
expect_used = "warn"
