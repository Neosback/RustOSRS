[workspace]
resolver = "3"
members = [
    "crates/osrs-core",
    "crates/osrs-cache",
    "crates/osrs-scene",
    "crates/osrs-reference",
]
default-members = [
    "crates/osrs-core",
    "crates/osrs-cache",
    "crates/osrs-scene",
    "crates/osrs-reference",
]

[workspace.package]
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
rune-fs = "0.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml_ng = "0.10.0"
sha2 = "0.10"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"
expect_used = "warn"
