    "--cfg",
    "docsrs",
]

[features]
rs3 = ["dep:lzma-rs"]

[lib]
name = "runefs"
path = "src/lib.rs"


[dependencies.bzip2]
version = "0.6.0"

[dependencies.flate2]
version = "1.0.27"

[dependencies.itertools]
version = "0.14"

[dependencies.lzma-rs]
