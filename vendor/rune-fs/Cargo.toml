[package]
edition = "2024"
rust-version = "1.88.0"
name = "rune-fs"
version = "0.2.0"
authors = ["jimvdl <jimvdlind@gmail.com>"]
build = false
exclude = [
    ".gitignore",
    "data/*",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Read-only, low level, virtual file types for the RuneScape file system."
documentation = "https://docs.rs/rune-fs"
readme = "README.md"
keywords = [
    "runescape",
    "osrs",
    "rs3",
]
categories = [
    "development-tools",
    "filesystem",
]
license = "MIT"
